services:
  notes-app:
    container_name: notes-app
    build:
      context: .
      target: production
    ports:
      - '3000:3000'
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000

  notes-app-dev:
    profiles: [development]
    container_name: notes-app-dev
    build:
      context: .
      target: development
    ports:
      - '3001:3000'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 3000
    volumes:
      - .:/app
      - notes-app-node-modules:/app/node_modules

volumes:
  notes-app-node-modules:
